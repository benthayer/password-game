server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Privacy: don't log requests
    access_log off;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml+rss application/javascript application/json;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Cache static assets
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # index.html must revalidate every load, or browsers heuristically cache
    # it and keep referencing old (deleted) hashed bundles after a deploy.
    # add_header in a location drops server-level headers, so re-declare them.
    location = /index.html {
        add_header Cache-Control "no-cache" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
    }

    # Handle React Router (client-side routing)
    # Try to serve the file, if not found, serve index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Suppress favicon 404 noise
    location = /favicon.ico {
        log_not_found off;
    }
}

